name: Listen podcast

on:
  schedule:
    - cron: "7 * * * *" # every hour
  workflow_dispatch:
    inputs:
      test_text:
        description: "نص تجريبي يتحول إلى حلقة (اختياري)"
        required: false
      retry:
        description: "عداد إعادة المحاولة التلقائية (لا تعدّله)"
        required: false
        default: "0"
      remove:
        description: "احذف الحلقات اللي عنوانها يحتوي هذا النص (اختياري)"
        required: false
      sample_voices:
        description: "أصوات للمقارنة مفصولة بفواصل (اختياري)، مثل en-US-AvaMultilingualNeural,google:en-US-Chirp3-HD-Charon"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: listen-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.build.outputs.changed }}
      more: ${{ steps.build.outputs.more }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: podcast/requirements.txt

      - run: pip install -r podcast/requirements.txt

      - id: pages
        uses: actions/configure-pages@v5

      # Last run's MP3s, so only new or missing files are fetched from the live site.
      - uses: actions/cache/restore@v4
        with:
          path: _mirror
          key: mirror-${{ github.run_id }}
          restore-keys: mirror-

      - id: build
        run: python podcast/build.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY }}
          VOICE_AR: ${{ vars.VOICE_AR }}
          VOICE_EN: ${{ vars.VOICE_EN }}
          TTS_RATE: ${{ vars.TTS_RATE }}
          TEST_TEXT: ${{ inputs.test_text }}
          SAMPLE_VOICES: ${{ inputs.sample_voices }}
          REMOVE_MATCH: ${{ inputs.remove }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}

      - if: steps.build.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: _mirror
          key: mirror-${{ github.run_id }}-${{ github.run_attempt }}

      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # A temporary failure (TTS or Pages hiccup) would otherwise stop the chain until the next hourly run.
      - name: Retry after a failure
        if: failure() && fromJSON(inputs.retry || '0') < 3
        run: |
          sleep 120
          gh workflow run podcast.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" -f retry=$(( ${{ inputs.retry || '0' }} + 1 ))
        env:
          GH_TOKEN: ${{ github.token }}

      # GitHub pauses scheduled workflows after 60 days without repo activity; keep this one on.
      - name: Keep schedule alive
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/podcast.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

      # One episode per run keeps new episodes appearing quickly; start the next run if more are waiting.
      - name: Continue with the next episode
        if: needs.build.outputs.more == 'true'
        run: gh workflow run podcast.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
